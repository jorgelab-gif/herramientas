server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Redirige www. al dominio sin www
    if ($host = www.herramientas.jorgelaborda.es) {
        return 301 https://herramientas.jorgelaborda.es$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    location /assets/ { expires 7d; add_header Cache-Control "public"; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain;
}
